services:
  # PostgreSQL Database
  - type: pserv
    name: llm-gateway-db
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: llm_gateway
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: ${POSTGRES_PASSWORD}

  # Redis Cache
  - type: redis
    name: llm-gateway-cache
    plan: free
    ipAllowList: []

  # API Server
  - type: web
    name: llm-gateway-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    startCommand: ./entrypoint.sh
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-gateway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: llm-gateway-cache
          property: redisUrl
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
